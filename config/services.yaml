# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: "../src/"
        exclude:
            - "../src/DependencyInjection/"
            - "../src/Infrastructure/Persistence/Doctrine/*/Entity/"
            - "../src/Kernel.php"

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    App\Application\Manager\JwtPayloadManager:
        public: true

    App\Infrastructure\Client\IgdbClient:
        arguments:
            $clientId: "%env(IGDB_CLIENT_ID)%"
            $clientSecret: "%env(IGDB_CLIENT_SECRET)%"

    App\Infrastructure\Persistence\Doctrine\User\Repository\DoctrineUserRepository:
        class: App\Infrastructure\Persistence\Doctrine\User\Repository\DoctrineUserRepository
        arguments: ["@doctrine"]

    App\Domain\Repository\User\UserRepositoryInterface: '@App\Infrastructure\Persistence\Doctrine\User\Repository\DoctrineUserRepository'

    App\Domain\Service\Game\GameApiServiceInterface:
        class: App\Application\Service\Game\ApiGameSearchService

    App\Domain\Repository\Game\ApiGameRepositoryInterface:
        class: App\Infrastructure\Repository\Game\IgdbApiRepository

    App\Application\Serializer\IgdbSearchResponseDtoArraySerializer:
        tags:
            - { name: "serializer.normalizer", priority: 90 }
